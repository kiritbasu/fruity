<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d14" />
    <title>Fruity — slice fruit with your hands</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🍉</text></svg>" />
  </head>
  <body>
    <div id="stage">
      <div id="camWrap"></div>
      <div id="scrim"></div>
      <canvas id="game"></canvas>

      <header id="hud" hidden>
        <div class="hud-left">
          <div class="score-row">
            <span id="score">0</span>
            <span id="combo" class="combo"></span>
          </div>
          <div class="best">BEST <b id="best">0</b></div>
        </div>

        <div class="hud-center">
          <div class="level-name" id="levelName">Orchard</div>
          <div class="progress"><i id="progressBar"></i></div>
          <div class="progress-text" id="progressText">0 / 12</div>
          <div class="clock" id="matchClock" hidden>3:00</div>
          <div class="clock-bar"><i id="matchClockBar"></i></div>
        </div>

        <div class="hud-right">
          <div id="lives" class="lives"></div>
          <button id="soundBtn" class="icon-btn" title="Mute (M)">🔊</button>
        </div>
      </header>

      <aside id="opponent" class="opponent" hidden>
        <video id="oppVideo" class="opp-video" playsinline autoplay muted hidden></video>
        <div class="opp-meta">
          <div class="opp-name" id="oppName">Opponent</div>
          <div class="opp-score" id="oppScore">0</div>
          <div class="opp-state" id="oppState"></div>
        </div>
      </aside>

      <div id="handWarning" class="hand-warning" hidden>
        <span class="dot"></span> Show your hand to the camera
      </div>

      <div id="overlay" class="overlay">
        <div class="panel" id="panel"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
